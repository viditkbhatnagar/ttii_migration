name: CI

on:
  push:
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages (required for lint/type resolution)
        run: |
          npm run build -w @ttii/shared-types
          npm run build -w @ttii/frontend-core
          npm run build -w @ttii/ui

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build apps
        run: |
          npm run build -w @ttii/api
          VITE_API_BASE_URL="" VITE_BASE_DOMAIN="teachersindia.in" npm run build -w @ttii/web
