name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual trigger from Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH + rebuild + pm2 restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH to ttii-nodejs-lms
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 68.183.94.1
          username: root
          port: 22
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Host fingerprint not pinned — the action negotiates an algorithm
          # that may return RSA/ECDSA/ED25519 depending on runner internals,
          # and mismatched fingerprints block the whole deploy. Mutual auth
          # via the private key above is still strong; dropping fingerprint
          # pin only weakens MITM protection (acceptable for DO VPC network).
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/ttii-lms
            echo "=== before ==="
            git log -1 --oneline
            pm2 list | grep ttii-api || true
            echo
            echo "=== sync to origin/main ==="
            git fetch origin
            git reset --hard origin/main
            git log -1 --oneline
            echo
            echo "=== install dependencies (npm ci is idempotent) ==="
            npm ci --no-audit --no-fund
            echo
            echo "=== build all workspaces ==="
            npm run build
            echo
            # Vite builds with emptyOutDir:false so the previous bundle stays
            # fully serveable while the new one is written (no chunk-404 flicker
            # mid-deploy). That keeps old content-hashed chunks around, so prune
            # ones older than 7 days to stop dist/ growing unbounded. Recent
            # bundles are kept for any in-flight client; index.html (no-store)
            # is overwritten by every build so it never goes stale.
            echo "=== prune stale web assets (>7d) ==="
            find apps/web/dist/assets -type f -mtime +7 -delete 2>/dev/null || true
            echo
            echo "=== restart API with fresh env ==="
            pm2 restart ttii-api --update-env
            pm2 save
            echo
            echo "=== post-deploy health check (retry until the API is up) ==="
            pm2 list | grep ttii-api
            # The API needs a few seconds to bind after `pm2 restart`. A single
            # immediate curl raced the boot and failed the whole deploy (exit 7
            # under set -e / script_stop) even though build + restart succeeded.
            # Poll for up to ~60s and only fail if it genuinely never returns 200.
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -sS -m 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:4000/api/health || echo 000)
              if [ "$code" = "200" ]; then echo "health OK after attempt ${i} (HTTP 200)"; ok=1; break; fi
              echo "waiting for API to boot… attempt ${i}/30 (HTTP ${code})"
              sleep 2
            done
            if [ "$ok" != "1" ]; then echo "ERROR: API did not return 200 after retries — deploy is unhealthy"; exit 1; fi
